<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGAS Games</title>
    <!-- Google Font match for home page consistency -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family: 'Space Grotesque', "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
            background:#0a0a16;
            overflow:hidden;
            height:100vh;
        }
        /* Star Background */
        .stars{
            position:fixed;
            inset:0;
            background-image: radial-gradient(2px 2px at 20px 30px,#fff,transparent),
                              radial-gradient(1.5px 1.5px at 80px 150px,#fff,transparent),
                              radial-gradient(2px 2px at 170px 70px,#fff,transparent),
                              radial-gradient(1.5px 1.5px at 250px 220px,#fff,transparent),
                              radial-gradient(2px 2px at 340px 120px,#fff,transparent),
                              radial-gradient(1.5px 1.5px at 430px 260px,#fff,transparent),
                              radial-gradient(2px 2px at 520px 40px,#fff,transparent),
                              radial-gradient(1.5px 1.5px at 610px 180px,#fff,transparent),
                              radial-gradient(2px 2px at 700px 80px,#fff,transparent),
                              radial-gradient(1.5px 1.5px at 790px 240px,#fff,transparent),
                              radial-gradient(2px 2px at 880px 120px,#fff,transparent),
                              radial-gradient(1.5px 1.5px at 970px 60px,#fff,transparent),
                              radial-gradient(2px 2px at 1060px 220px,#fff,transparent),
                              radial-gradient(1.5px 1.5px at 1150px 100px,#fff,transparent);
            background-size:250px 250px;
            animation:twinkle 5s infinite alternate;
        }
        @keyframes twinkle{
            from{opacity:.7;}
            to{opacity:1;}
        }
        /* Shooting Stars */
        .shooting-star{
            position:absolute;
            width:180px;
            height:2px;
            background:linear-gradient(to right,#fff,transparent);
            border-radius:50%;
            transform:rotate(-35deg);
            animation:shoot linear infinite;
            will-change: transform;
        }
        .shooting-star::before{
            content:"";
            position:absolute;
            width:8px;
            height:8px;
            background:#fff;
            border-radius:50%;
            left:-4px;
            top:-3px;
            box-shadow:0 0 12px white;
        }
        .s1{top:8%;left:-20%;animation-duration:5s;animation-delay:0s;}
        .s2{top:30%;left:-35%;animation-duration:7s;animation-delay:2s;}
        .s3{top:55%;left:-25%;animation-duration:6s;animation-delay:4s;}
        .s4{top:75%;left:-30%;animation-duration:8s;animation-delay:1s;}
        
        @keyframes shoot{
            from{ transform: translate3d(0, 0, 0) rotate(-35deg); opacity:1; }
            to{ transform: translate3d(105vw, 50vh, 0) rotate(-35deg); opacity:0; }
        }
        
        /* Main Content */
        .container{
            position:relative;
            z-index:5;
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:20px;
        }
        h1{
            color:#00d2ff;
            font-size: clamp(40px, 8vw, 72px);
            letter-spacing:4px;
            margin-bottom:40px;
            text-shadow:0 0 18px rgba(0, 210, 255, 0.6);
            font-weight: 700;
        }
        
        /* Fixed Grid Wrapper with Semantic Style Integration */
        .games-grid {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            width:min(900px,90%);
            max-height: 60vh;
            overflow-y: auto; 
            padding: 10px;
            list-style: none;
        }

        /* Neon Custom Scrollbar for better UI styling */
        .games-grid::-webkit-scrollbar {
            width: 8px;
        }
        .games-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .games-grid::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.3);
            border-radius: 10px;
        }
        .games-grid::-webkit-scrollbar-thumb:hover {
            background: #00d2ff;
        }
        
        .btn-game{
            width:100%;
            text-align: center;
            text-decoration:none;
            font-size:22px;
            padding:18px;
            border-radius:40px;
            border:2px solid #00d2ff;
            background:rgba(255,255,255,.08);
            color:#00d2ff;
            cursor:pointer;
            transition:.25s;
            display: block;
            outline: none;
        }
        .btn-game:hover, .btn-game:focus-visible{
            background:#00d2ff;
            color:#05050d;
            transform:translateY(-5px) scale(1.05);
            box-shadow:0 0 20px rgba(0,210,255,.8);
        }
        .btn-game:focus-visible, .btn-back:focus-visible {
            outline: 3px solid #00d2ff;
            outline-offset: 4px;
        }
        
        .back{
            margin-top:35px;
        }
        .btn-back{
            text-decoration: none;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            background: rgba(255,255,255,.05);
            font-size:18px;
            padding:14px 30px;
            border-radius: 40px;
            transition: .25s;
            display: inline-block;
            outline: none;
        }
        .btn-back:hover, .btn-back:focus-visible {
            background: #00d2ff;
            color: #05050d;
            box-shadow:0 0 20px rgba(0,210,255,.6);
        }

        /* Accessibility: Stop animations if user prefers reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .stars, .shooting-star {
                animation: none !important;
            }
            .shooting-star { display: none; }
        }
    </style>
</head>
<body>
    <!-- Screen reader hidden decorative area -->
    <div aria-hidden="true">
        <div class="stars"></div>
        <div class="shooting-star s1"></div>
        <div class="shooting-star s2"></div>
        <div class="shooting-star s3"></div>
        <div class="shooting-star s4"></div>
    </div>

    <main class="container">
        <header>
            <h1>Games</h1>
        </header>
        
        <!-- Clean Semantic List Layout inside Navigation tag -->
        <nav aria-label="Games Selection Links" style="width: 100%; display: flex; justify-content: center;">
            <ul class="games-grid">
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/falling-fred" target="_blank" rel="noopener noreferrer">Falling Fred</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/running-fred" target="_blank" rel="noopener noreferrer">Running Fred</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/brotato" target="_blank" rel="noopener noreferrer">Brotato</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/ultrakill" target="_blank" rel="noopener noreferrer">ULTRAKILL</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/gd" target="_blank" rel="noopener noreferrer">Geometry Dash</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/backyard-baseball" target="_blank" rel="noopener noreferrer">Backyard Baseball</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/DOOM" target="_blank" rel="noopener noreferrer">DOOM</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/crazycattle3d" target="_blank" rel="noopener noreferrer">Crazy Cattle 3D</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/bad-piggies" target="_blank" rel="noopener noreferrer">Bad Piggies</a></li>
                <li><a class="btn-game" href="https://sites.google.com/aacps.org/ugas/games/bart-blast" target="_blank" rel="noopener noreferrer">Bart Blast</a></li>
            </ul>
        </nav>
        
        <div class="back">
            <a class="btn-back" href="https://sites.google.com/aacps.org/ugas">← Back to Hub</a>
        </div>
    </main>
</body>
</html>
