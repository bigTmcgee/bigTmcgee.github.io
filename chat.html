<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGAS Hub Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Century Gothic", CenturyGothic, AppleGothic, sans-serif;
    background:#000;
    overflow:hidden;
    height:100vh;
}

/* Star Background */
.stars{
    position:fixed;
    inset:0;
    background-image:
        radial-gradient(2px 2px at 20px 30px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 80px 150px,#fff,transparent),
        radial-gradient(2px 2px at 170px 70px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 250px 220px,#fff,transparent),
        radial-gradient(2px 2px at 340px 120px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 430px 260px,#fff,transparent),
        radial-gradient(2px 2px at 520px 40px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 610px 180px,#fff,transparent),
        radial-gradient(2px 2px at 700px 80px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 790px 240px,#fff,transparent),
        radial-gradient(2px 2px at 880px 120px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 970px 60px,#fff,transparent),
        radial-gradient(2px 2px at 1060px 220px,#fff,transparent),
        radial-gradient(1.5px 1.5px at 1150px 100px,#fff,transparent);
    background-size:250px 250px;
    animation:twinkle 5s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.7;}
    to{opacity:1;}
}

/* Shooting Stars */
.shooting-star{
    position:absolute;
    width:180px;
    height:2px;
    background:linear-gradient(to right,#fff,transparent);
    border-radius:50%;
    transform:rotate(-35deg);
    animation:shoot linear infinite;
}

.shooting-star::before{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:#fff;
    border-radius:50%;
    left:-4px;
    top:-3px;
    box-shadow:0 0 12px white;
}

.s1{top:8%;left:-20%;animation-duration:5s;animation-delay:0s;}
.s2{top:30%;left:-35%;animation-duration:7s;animation-delay:2s;}
.s3{top:55%;left:-25%;animation-duration:6s;animation-delay:4s;}
.s4{top:75%;left:-30%;animation-duration:8s;animation-delay:1s;}

@keyframes shoot{
    from{
        transform:translateX(0) translateY(0) rotate(-35deg);
        opacity:1;
    }
    to{
        transform:translateX(1800px) translateY(600px) rotate(-35deg);
        opacity:0;
    }
}

/* Main Layout */
.container{
    position:relative;
    z-index:5;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    padding:20px;
}

h1{
    color:#003b8e;
    font-size:64px;
    letter-spacing:4px;
    text-shadow:0 0 18px rgba(0,59,142,.7);
}

/* Chat Container */
.chat-box{
    width:min(90vw,800px);
    height:min(80vh,800px);
    border:2px solid #003b8e;
    border-radius:20px;
    overflow:hidden;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(8px);
    box-shadow:
        0 0 30px rgba(0,59,142,.45),
        inset 0 0 20px rgba(0,59,142,.15);
}

/* Buttons */
.buttons{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.back{
    text-decoration:none;
}

.back button{
    font-family:"Century Gothic", CenturyGothic, AppleGothic, sans-serif;
    font-size:18px;
    padding:12px 30px;
    border-radius:40px;
    border:2px solid #003b8e;
    background:rgba(255,255,255,.08);
    color:#003b8e;
    cursor:pointer;
    transition:.25s;
}

.back button:hover{
    background:#003b8e;
    color:#fff;
    transform:translateY(-4px);
    box-shadow:0 0 18px rgba(0,59,142,.8);
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="shooting-star s1"></div>
<div class="shooting-star s2"></div>
<div class="shooting-star s3"></div>
<div class="shooting-star s4"></div>

<div class="container">

    <h1>UGAS Hub Chat</h1>

    <div class="chat-box">

        <script
            id="cid0020000444377952348"
            data-cfasync="false"
            async
            src="//st.chatango.com/js/gz/emb.js"
            style="width:100%;height:100%;">
        {
            "handle":"ugas-hub",
            "arch":"js",
            "styles":{
                "a":"003B8E",
                "b":0,
                "c":"FFFFFF",
                "d":"FFFFFF",
                "k":"003B8E",
                "l":"66AAFF",
                "m":"003B8E",
                "n":"FFFFFF",
                "p":"12",
                "q":"003B8E",
                "r":0,
                "fwtickm":1
            }
        }
        </script>

    </div>

    <div class="buttons">
        <a href="https://bigtmcgee.github.io/" class="back" target="_blank">
            <button>🏠 Go to UGAS Website</button>
        </a>

        <a href="https://discord.gg/8hZDxxcQ" class="back" target="_blank">
            <button>💬 Join the Discord!</button>
        </a>
    </div>

</div>

</body>
</html>
